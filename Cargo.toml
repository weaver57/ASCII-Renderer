[package]
name = "ascii_renderer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "generate_ramp"
path = "src/bin/generate_ramp.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
fontdue = "0.9"

[dev-dependencies]
